name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 ripgrep perl dpkg-dev dkms

      - name: Repository documentation and boundary checks
        run: bash scripts/check-docs.sh

      - name: Unit tests (manifest, license audit, version ordering, extractor, results parser, exec probes, vaapi decode, dmabuf regression, dri repair, collab structure, suspend resume/finalize)
        run: |
          bash tests/unit/run-manifest-tests.sh
          bash tests/unit/run-license-audit-tests.sh
          bash tests/unit/run-version-tests.sh
          bash tests/unit/run-extractor-tests.sh
          bash tests/unit/run-results-parser-tests.sh
          bash tests/unit/run-exec-probes-tests.sh
          bash tests/unit/run-vaapi-decode-tests.sh
          bash tests/unit/run-dmabuf-regression-tests.sh
          bash tests/unit/run-dri-repair-tests.sh
          bash tests/unit/run-collab-structure-tests.sh
          bash tests/unit/run-suspend-resume-tests.sh
          bash tests/unit/run-suspend-failure-finalize-tests.sh

      - name: fbterm static tests
        run: bash tests/fbterm/run-static-tests.sh

      - name: Package boundary tests (self-generated fixtures)
        run: bash tests/package/run-boundary-tests.sh

      - name: Picom installer/session tests
        run: |
          bash tests/picom/run-install-tests.sh
          bash tests/picom/run-session-tests.sh

      - name: xdisplay install-boundary tests
        run: bash tests/xdisplay/run-install-tests.sh
